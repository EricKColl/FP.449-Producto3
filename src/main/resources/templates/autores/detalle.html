<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${autor.nombreCompleto})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('autores')}"></nav>

<main class="container py-4">
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

  <a class="volver" th:href="@{/autores}"><i class="ti ti-arrow-left"></i> Volver a autores</a>

  <!-- Cabecera del autor -->
  <section class="ficha-autor">
    <span class="monograma monograma-grande"
          th:text="${#strings.substring(autor.nombre, 0, 1)} + ${#strings.substring(autor.apellidos, 0, 1)}">GM</span>
    <div class="ficha-autor-datos">
      <p class="seccion-etiqueta">Autor del catálogo</p>
      <h1 class="ficha-titulo" th:text="${autor.nombreCompleto}">Gabriel García Márquez</h1>
      <div class="ficha-etiquetas">
        <span class="etiqueta"><i class="ti ti-world"></i>
          <span th:text="${autor.nacionalidad} ?: 'Nacionalidad sin indicar'">Colombiana</span></span>
        <span class="etiqueta" th:if="${autor.fechaNacimiento != null}"><i class="ti ti-cake"></i>
          <span th:text="'Nació el ' + ${#temporals.format(autor.fechaNacimiento, 'd ''de'' MMMM ''de'' yyyy')}">Nació</span></span>
        <span class="etiqueta"><i class="ti ti-books"></i>
          <span th:text="${#lists.size(libros)} + (${#lists.size(libros) == 1} ? ' libro en el catálogo' : ' libros en el catálogo')">2 libros</span></span>
      </div>
      <div class="ficha-acciones" sec:authorize="hasRole('ADMIN')">
        <a class="btn btn-sesion" th:href="@{/admin/autores/{id}/editar(id=${autor.id})}">
          <i class="ti ti-pencil"></i> Editar
        </a>
        <form method="post" th:action="@{/admin/autores/{id}/eliminar(id=${autor.id})}"
              th:data-confirmar="|¿Eliminar a «${autor.nombreCompleto}»?|">
          <button class="btn btn-outline-danger btn-redondo" type="submit"><i class="ti ti-trash"></i> Eliminar</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Bibliografía -->
  <section class="seccion-tablero">
    <div class="seccion-cabecera">
      <div>
        <p class="seccion-etiqueta">Bibliografía</p>
        <h2 class="seccion-titulo">Sus libros en la biblioteca</h2>
      </div>
    </div>
    <div class="rejilla-catalogo" th:unless="${#lists.isEmpty(libros)}">
      <th:block th:each="item : ${libros}">
        <a th:replace="~{fragments/layout :: cubierta(${item.libro}, ${item.disponibles})}"></a>
      </th:block>
    </div>
    <div class="vacio-grande" th:if="${#lists.isEmpty(libros)}">
      <i class="ti ti-feather"></i>
      <span>Este autor no tiene libros en el catálogo.</span>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
