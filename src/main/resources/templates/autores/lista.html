<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Autores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('autores')}"></nav>

<main class="container py-4">
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

  <div class="cabecera-panel">
    <h1 class="titulo-panel">Autores</h1>
    <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/autores/nuevo}">
      <i class="ti ti-plus"></i> Nuevo autor
    </a>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th>Autor</th>
          <th>Nacionalidad</th>
          <th>Fecha de nacimiento</th>
          <th class="text-end">Libros</th>
          <th class="text-end" sec:authorize="hasRole('ADMIN')">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="autor : ${autores}">
          <td>
            <a th:href="@{/autores/{id}(id=${autor.id})}" th:text="${autor.nombreCompleto}">Autor</a>
          </td>
          <td th:text="${autor.nacionalidad} ?: '—'">Nacionalidad</td>
          <td th:text="${autor.fechaNacimiento != null}
                ? ${#temporals.format(autor.fechaNacimiento, 'dd/MM/yyyy')} : '—'">01/01/1900</td>
          <td class="text-end">
            <span class="badge text-bg-secondary" th:text="${#sets.size(autor.libros)}">1</span>
          </td>
          <td class="text-end text-nowrap" sec:authorize="hasRole('ADMIN')">
            <a class="btn btn-sm btn-outline-primary" title="Editar"
             th:href="@{/admin/autores/{id}/editar(id=${autor.id})}">
              <i class="ti ti-pencil"></i>
            </a>
            <form class="d-inline" method="post"
               th:action="@{/admin/autores/{id}/eliminar(id=${autor.id})}"
               th:data-nombre="${autor.nombreCompleto}"
               onsubmit="return confirm('¿Eliminar a «' + this.dataset.nombre + '»?')">
              <button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar">
                <i class="ti ti-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
