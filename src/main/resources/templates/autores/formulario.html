<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${autor.id == null} ? 'Nuevo autor' : 'Editar autor')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('autores')}"></nav>

<main class="container py-4">
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
  <h1 class="h3 mb-3" th:text="${autor.id == null} ? 'Nuevo autor' : 'Editar autor'">Nuevo autor</h1>

  <form class="card card-body" method="post" novalidate th:object="${autor}"
     th:action="${autor.id == null} ? @{/admin/autores} : @{/admin/autores/{id}(id=${autor.id})}">
    <div class="row g-3">
      <div class="col-md-5">
        <label for="nombre" class="form-label">Nombre *</label>
        <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
      </div>
      <div class="col-md-7">
        <label for="apellidos" class="form-label">Apellidos *</label>
        <input type="text" class="form-control" th:field="*{apellidos}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{apellidos}">Error</div>
      </div>
      <div class="col-md-5">
        <label for="nacionalidad" class="form-label">Nacionalidad</label>
        <input type="text" class="form-control" th:field="*{nacionalidad}" th:errorclass="is-invalid"
           placeholder="Española">
        <div class="invalid-feedback" th:errors="*{nacionalidad}">Error</div>
      </div>
      <div class="col-md-4">
        <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
        <input type="date" class="form-control" th:field="*{fechaNacimiento}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{fechaNacimiento}">Error</div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary">
        <i class="ti ti-check"></i> Guardar
      </button>
      <a class="btn btn-outline-secondary"
       th:href="${autor.id == null} ? @{/autores} : @{/autores/{id}(id=${autor.id})}">Cancelar</a>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
