<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container py-5 text-center">
    <p class="display-3 fw-bold text-body-tertiary mb-2" th:text="${status}">404</p>
    <th:block th:switch="${status}">
        <h1 class="h4" th:case="404">Esta página no existe o todavía no está implementada</h1>
        <h1 class="h4" th:case="403">No tienes permiso para acceder a esta página</h1>
        <h1 class="h4" th:case="*">Se ha producido un error inesperado</h1>
    </th:block>
    <p class="text-body-secondary" th:text="${path}">/ruta</p>
    <a class="btn btn-primary mt-2" th:href="@{/}"><i class="ti ti-home me-1"></i> Volver al inicio</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
