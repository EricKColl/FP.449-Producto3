<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('registro')}"></nav>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-9 col-xl-8">
      <div class="cabecera-panel">
        <h1 class="titulo-panel titulo-oro">Crear cuenta</h1>
      </div>
      <p class="text-body-secondary">Regístrate como socio de la biblioteca. Los campos con * son obligatorios.</p>

      <form class="card card-body" method="post" novalidate th:action="@{/registro}" th:object="${usuario}">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre *</label>
            <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid"
                   autocomplete="given-name" maxlength="80" required autofocus>
            <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
          </div>
          <div class="col-md-6">
            <label for="apellidos" class="form-label">Apellidos *</label>
            <input type="text" class="form-control" th:field="*{apellidos}" th:errorclass="is-invalid"
                   autocomplete="family-name" maxlength="120" required>
            <div class="invalid-feedback" th:errors="*{apellidos}">Error</div>
          </div>
          <div class="col-md-4">
            <label for="dni" class="form-label">DNI/NIE *</label>
            <input type="text" class="form-control" th:field="*{dni}" th:errorclass="is-invalid"
                   placeholder="12345678Z" maxlength="9" required>
            <div class="invalid-feedback" th:errors="*{dni}">Error</div>
          </div>
          <div class="col-md-8">
            <label for="email" class="form-label">Email *</label>
            <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid"
                   autocomplete="email" maxlength="120" required>
            <div class="invalid-feedback" th:errors="*{email}">Error</div>
          </div>
          <div class="col-12">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" th:field="*{telefono}" th:errorclass="is-invalid"
                   autocomplete="tel" maxlength="20">
            <div class="invalid-feedback" th:errors="*{telefono}">Error</div>
          </div>
          <div class="col-md-6">
            <label for="password" class="form-label">Contraseña *</label>
            <input type="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid"
                   autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="ayuda-password">
            <div class="invalid-feedback" th:errors="*{password}">Error</div>
            <div id="ayuda-password" class="form-text">Usa al menos 8 caracteres.</div>
          </div>
          <div class="col-md-6">
            <label for="confirmarPassword" class="form-label">Repetir contraseña *</label>
            <input type="password" class="form-control" id="confirmarPassword" name="confirmarPassword"
                   autocomplete="new-password" minlength="8" maxlength="72" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary align-self-start mt-4">
          <i class="ti ti-user-plus"></i> Crear cuenta
        </button>
      </form>
      <p class="mt-3">¿Ya tienes una cuenta? <a th:href="@{/login}">Iniciar sesión</a></p>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
