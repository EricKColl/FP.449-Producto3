<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Fragmentos comunes a todas las páginas. Plantilla mínima de una vista nueva:

  <!DOCTYPE html>
  <html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Libros')}"></head>
  <body>
  <nav th:replace="~{fragments/layout :: navbar('libros')}"></nav>
  <main class="container py-4">
      <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
      ... contenido ...
  </main>
  <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
  </html>

  navbar(seccion) pinta el menú lateral según el rol y marca como activa la opción:
  inicio | libros | autores | cuenta | usuarios | prestamos | login
  data-bs-theme="dark" activa el modo oscuro de Bootstrap; los colores de BackLord están en css/estilos.css.
-->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title th:text="${titulo} + ' · Biblioteca'">Biblioteca</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/tabler__icons-webfont/dist/tabler-icons-outline.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/fontsource__inter/400.css}">
    <link rel="stylesheet" th:href="@{/webjars/fontsource__inter/500.css}">
    <link rel="stylesheet" th:href="@{/webjars/fontsource__inter/600.css}">
    <link rel="stylesheet" th:href="@{/webjars/fontsource__playfair-display/500.css}">
    <link rel="stylesheet" th:href="@{/webjars/fontsource__playfair-display/600.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>

<!-- Menú lateral fijo en escritorio; en pantallas pequeñas se abre desde la barra superior -->
<th:block th:fragment="navbar(seccion)">
    <header class="barra-movil d-lg-none">
        <a class="marca" th:href="@{/}">
            <img class="marca-icono" th:src="@{/img/corona-backlord.webp}" alt="" width="34" height="34">
            <span class="marca-nombre">Biblioteca</span>
        </a>
        <button class="btn btn-icono" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu-lateral"
                aria-controls="menu-lateral" aria-label="Mostrar menú">
            <i class="ti ti-menu-2"></i>
        </button>
    </header>

    <aside class="offcanvas-lg offcanvas-start barra-lateral" tabindex="-1" id="menu-lateral" aria-label="Menú principal">
        <div class="barra-lateral-cabecera">
            <a class="marca" th:href="@{/}">
                <img class="marca-icono" th:src="@{/img/corona-backlord.webp}" alt="" width="44" height="44">
                <span>
                    <span class="marca-nombre">Biblioteca</span>
                    <span class="marca-grupo">BackLord</span>
                </span>
            </a>
            <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas"
                    data-bs-target="#menu-lateral" aria-label="Cerrar menú"></button>
        </div>
        <nav class="menu">
            <a class="menu-enlace" th:classappend="${seccion == 'inicio'} ? 'active'"
               th:aria-current="${seccion == 'inicio'} ? 'page'" th:href="@{/}">
                <i class="ti ti-layout-dashboard"></i> Inicio
            </a>
            <a class="menu-enlace" th:classappend="${seccion == 'libros'} ? 'active'"
               th:aria-current="${seccion == 'libros'} ? 'page'" th:href="@{/libros}">
                <i class="ti ti-books"></i> Libros
            </a>
            <a class="menu-enlace" th:classappend="${seccion == 'autores'} ? 'active'"
               th:aria-current="${seccion == 'autores'} ? 'page'" th:href="@{/autores}">
                <i class="ti ti-feather"></i> Autores
            </a>
            <a class="menu-enlace" sec:authorize="isAuthenticated()" th:classappend="${seccion == 'cuenta'} ? 'active'"
               th:aria-current="${seccion == 'cuenta'} ? 'page'" th:href="@{/user/cuenta}">
                <i class="ti ti-user-circle"></i> Mi cuenta
            </a>
            <th:block sec:authorize="hasRole('ADMIN')">
                <p class="menu-grupo">Administración</p>
                <a class="menu-enlace" th:classappend="${seccion == 'usuarios'} ? 'active'"
                   th:aria-current="${seccion == 'usuarios'} ? 'page'" th:href="@{/usuarios}">
                    <i class="ti ti-users-group"></i> Usuarios
                </a>
                <a class="menu-enlace" th:classappend="${seccion == 'prestamos'} ? 'active'"
                   th:aria-current="${seccion == 'prestamos'} ? 'page'" th:href="@{/prestamos}">
                    <i class="ti ti-arrows-exchange"></i> Préstamos
                </a>
            </th:block>
        </nav>
        <div class="barra-lateral-sesion">
            <th:block sec:authorize="isAuthenticated()">
                <p class="sesion-email" sec:authentication="name">usuario@example.com</p>
                <p class="sesion-rol" sec:authorize="hasRole('ADMIN')">Administrador</p>
                <p class="sesion-rol" sec:authorize="!hasRole('ADMIN')">Usuario</p>
                <form method="post" th:action="@{/logout}">
                    <button class="btn btn-outline-secondary btn-sm w-100" type="submit">
                        <i class="ti ti-logout-2"></i> Cerrar sesión
                    </button>
                </form>
            </th:block>
            <a class="btn btn-primary btn-sm w-100" sec:authorize="!isAuthenticated()" th:href="@{/login}">
                <i class="ti ti-login-2"></i> Iniciar sesión
            </a>
        </div>
        <div class="barra-lateral-pie">FP065 · UOC</div>
    </aside>
</th:block>

<!-- Mensajes flash: redirectAttributes.addFlashAttribute("mensajeExito" | "mensajeError", "...") -->
<th:block th:fragment="alertas">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="ti ti-circle-check me-1"></i> <span th:text="${mensajeExito}">Operación realizada</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="ti ti-alert-triangle me-1"></i> <span th:text="${mensajeError}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</th:block>

<!-- Estado de un préstamo con su color:
     <span th:replace="~{fragments/layout :: estadoPrestamo(${prestamo})}"></span> -->
<span th:fragment="estadoPrestamo(prestamo)" class="estado"
      th:classappend="${prestamo.estado.name() == 'VENCIDO'} ? 'estado-vencido'
                      : (${prestamo.devuelto} ? 'estado-devuelto' : 'estado-activo')"
      th:text="${prestamo.estado.etiqueta}">Activo</span>

<footer th:fragment="footer" class="pie">
    <div class="container py-3 small text-center">FP065 · UOC · Proyecto Biblioteca</div>
    <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
</footer>

</html>
