<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis préstamos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('mis-prestamos')}"></nav>
<main class="container py-4">
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
    <div class="cabecera-pestana">
        <h1 class="visually-hidden">Mis préstamos</h1>
        <a class="btn btn-primary btn-accion" th:href="@{/libros}">
            <i class="ti ti-books"></i> Ver el catálogo
        </a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Libro</th>
                    <th>Prestado</th>
                    <th>Devolución prevista</th>
                    <th>Devuelto</th>
                    <th>Estado</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prestamo : ${prestamos}">
                    <td><a th:href="@{/libros/{id}(id=${prestamo.libro.id})}"
                           th:text="${prestamo.libro.titulo}">Libro</a></td>
                    <td th:text="${#temporals.format(prestamo.fechaPrestamo, 'dd/MM/yyyy')}">01/10/2026</td>
                    <td th:text="${#temporals.format(prestamo.fechaDevolucionPrevista, 'dd/MM/yyyy')}">15/10/2026</td>
                    <td th:text="${prestamo.devuelto} ? ${#temporals.format(prestamo.fechaDevolucion, 'dd/MM/yyyy')} : '—'">—</td>
                    <td><span th:replace="~{fragments/layout :: estadoPrestamo(${prestamo})}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(prestamos)}">
                    <td colspan="5" class="text-center text-body-secondary py-4">Todavía no has pedido ningún libro.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
