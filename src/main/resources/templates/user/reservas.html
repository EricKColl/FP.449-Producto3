<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis reservas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('mis-reservas')}"></nav>
<main class="container py-4" th:with="activas=${reservas.?[activa]}, pasadas=${reservas.?[!activa]}">
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
    <h1 class="visually-hidden">Mis reservas</h1>
    <th:block th:replace="~{fragments/layout :: consejo('reservas', 'bookmark', '¿Cómo se reserva un libro?',
        'Desde la ficha de un libro que no tenga ejemplares disponibles, con el botón «Reservar». En cuanto vuelva un ejemplar lo verás en tu inicio, listo para pedirlo.')}"></th:block>

    <article class="bloque" data-aparecer>
        <header class="bloque-cabecera">
            <h2><i class="ti ti-bookmark"></i> Reservas activas</h2>
            <span class="chip-cuenta" th:text="${#lists.size(activas)}">1</span>
        </header>
        <ul class="tarjetas-reserva">
            <li class="tarjeta-reserva" th:each="r : ${activas}" th:with="libres=${disponibles.get(r.libro.id)}"
                th:classappend="${libres > 0} ? 'lista'">
                <span class="lomo" th:classappend="|tono-${r.libro.id % 6}|"><i class="ti ti-crown"></i></span>
                <div class="reserva-datos">
                    <a class="prestamo-titulo" th:href="@{/libros/{id}(id=${r.libro.id})}" th:text="${r.libro.titulo}">El capitán Alatriste</a>
                    <span class="prestamo-autor" th:text="${r.libro.autoresTexto}">Arturo Pérez-Reverte</span>
                    <span class="reserva-fecha" th:text="'Reservado el ' + ${#temporals.format(r.fechaReserva, 'd ''de'' MMMM')}">Reservado el 1 de noviembre</span>
                </div>
                <div class="reserva-estado">
                    <span class="estado" th:classappend="${libres > 0} ? 'estado-listo' : 'estado-activo'"
                          th:text="${libres > 0} ? '¡Ya hay ejemplar!' : 'En espera'">En espera</span>
                    <div class="reserva-acciones">
                        <form th:if="${libres > 0}" method="post" th:action="@{/user/prestamos}" data-enviando>
                            <input type="hidden" name="libroId" th:value="${r.libro.id}">
                            <button class="btn btn-sm btn-primary" type="submit"><i class="ti ti-book-download"></i> Pedir</button>
                        </form>
                        <form method="post" th:action="@{/user/reservas/{id}/cancelar(id=${r.id})}"
                              th:data-confirmar="|¿Cancelar la reserva de «${r.libro.titulo}»?|" data-confirmar-boton="Sí, cancelarla">
                            <button class="btn btn-sm btn-texto-peligro" type="submit">
                                <i class="ti ti-x"></i> Cancelar
                            </button>
                        </form>
                    </div>
                </div>
            </li>
            <li th:if="${#lists.isEmpty(activas)}" class="vacio-grande">
                <i class="ti ti-bookmark-off"></i>
                <span th:text="${#lists.isEmpty(reservas)} ? 'No tienes reservas. Si un libro no tiene ejemplares, resérvalo desde su ficha.'
                               : 'No tienes reservas activas ahora mismo.'">No tienes reservas.</span>
            </li>
        </ul>
    </article>

    <article class="bloque mt-4" th:unless="${#lists.isEmpty(pasadas)}" data-aparecer>
        <header class="bloque-cabecera">
            <h2><i class="ti ti-history"></i> Reservas anteriores</h2>
            <span class="chip-cuenta" th:text="${#lists.size(pasadas)}">1</span>
        </header>
        <ul class="lista-panel lista-historial">
            <li th:each="r : ${pasadas}">
                <span class="lomo lomo-mini" th:classappend="|tono-${r.libro.id % 6}|" aria-hidden="true"></span>
                <span class="lista-datos">
                    <a th:href="@{/libros/{id}(id=${r.libro.id})}" th:text="${r.libro.titulo}">Libro</a>
                    <small th:text="'Reservado el ' + ${#temporals.format(r.fechaReserva, 'dd/MM/yyyy')}">Reservado</small>
                </span>
                <span class="estado estado-neutro" th:text="${r.estado.etiqueta}">Cancelada</span>
            </li>
        </ul>
    </article>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
