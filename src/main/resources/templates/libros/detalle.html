<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${libro.titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('libros')}"></nav>

<main class="container py-4">
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

  <a class="btn btn-link px-0 mb-2" th:href="@{/libros}">
    <i class="ti ti-arrow-left"></i> Volver a libros
  </a>

  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
      <h1 class="h3 mb-1" th:text="${libro.titulo}">Título</h1>
      <p class="text-body-secondary mb-0" th:text="${libro.autoresTexto}">Autores</p>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-primary" th:href="@{/libros/{id}/editar(id=${libro.id})}">
        <i class="ti ti-pencil"></i> Editar
      </a>
      <form method="post" th:action="@{/libros/{id}/eliminar(id=${libro.id})}"
         th:data-titulo="${libro.titulo}"
         onsubmit="return confirm('¿Eliminar «' + this.dataset.titulo + '»?')">
        <button class="btn btn-outline-danger" type="submit">
          <i class="ti ti-trash"></i> Eliminar
        </button>
      </form>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-5 col-xl-4">
      <div class="card">
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-6">ISBN</dt>
            <dd class="col-6 text-nowrap" th:text="${libro.isbn}">ISBN</dd>
            <dt class="col-6">Editorial</dt>
            <dd class="col-6" th:text="${libro.editorial} ?: '—'">Editorial</dd>
            <dt class="col-6">Año</dt>
            <dd class="col-6" th:text="${libro.anioPublicacion} ?: '—'">Año</dd>
            <dt class="col-6">Género</dt>
            <dd class="col-6" th:text="${libro.genero} ?: '—'">Género</dd>
            <dt class="col-6">Ejemplares</dt>
            <dd class="col-6" th:text="${libro.ejemplares}">1</dd>
            <dt class="col-6">Disponibles</dt>
            <dd class="col-6 mb-0">
              <span class="badge" th:text="${disponibles}"
                 th:classappend="${disponibles > 0} ? 'text-bg-success' : 'text-bg-danger'">1</span>
            </dd>
          </dl>
        </div>
      </div>
    </div>

    <div class="col-lg-7 col-xl-8" sec:authorize="hasRole('ADMIN')">
      <div class="card">
        <div class="card-header fw-semibold">Historial de préstamos</div>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th>Usuario</th>
              <th>Prestado</th>
              <th>Devolución prevista</th>
              <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="prestamo : ${libro.prestamos}">
              <td>
                <a th:href="@{/usuarios/{id}(id=${prestamo.usuario.id})}"
                 th:text="${prestamo.usuario.nombreCompleto}">Usuario</a>
              </td>
              <td th:text="${#temporals.format(prestamo.fechaPrestamo, 'dd/MM/yyyy')}">01/10/2026</td>
              <td th:text="${#temporals.format(prestamo.fechaDevolucionPrevista, 'dd/MM/yyyy')}">15/10/2026</td>
              <td><span th:replace="~{fragments/layout :: estadoPrestamo(${prestamo})}"></span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(libro.prestamos)}">
              <td colspan="4" class="text-center text-body-secondary py-4">
                Este libro todavía no se ha prestado.
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
