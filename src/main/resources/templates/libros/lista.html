<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Libros')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('libros')}"></nav>

<main class="container py-4">
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

  <div class="cabecera-pestana">
    <h1 class="visually-hidden">Libros</h1>
    <a class="btn btn-primary btn-accion" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/libros/nuevo}">
      <i class="ti ti-plus"></i> Nuevo libro
    </a>
  </div>

  <form class="mb-3" method="get" th:action="@{/libros}">
    <div class="input-group">
      <input class="form-control" type="search" aria-label="Buscar por título, ISBN o autor" name="q" th:value="${q}"
         placeholder="Buscar por título, ISBN o autor">
      <button class="btn btn-outline-secondary" type="submit">
        <i class="ti ti-search"></i> Buscar
      </button>
    </div>
  </form>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th>Título</th>
          <th>Autores</th>
          <th>ISBN</th>
          <th>Año</th>
          <th class="text-end" sec:authorize="hasRole('ADMIN')">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="libro : ${libros}">
          <td>
            <a th:href="@{/libros/{id}(id=${libro.id})}" th:text="${libro.titulo}">Título</a>
          </td>
          <td th:text="${libro.autoresTexto}">Autores</td>
          <td class="text-nowrap" th:text="${libro.isbn}">ISBN</td>
          <td th:text="${libro.anioPublicacion}">Año</td>
          <td class="text-end text-nowrap" sec:authorize="hasRole('ADMIN')">
            <a class="btn btn-sm btn-outline-primary" title="Editar"
             th:href="@{/admin/libros/{id}/editar(id=${libro.id})}">
              <i class="ti ti-pencil"></i>
            </a>
            <form class="d-inline" method="post"
               th:action="@{/admin/libros/{id}/eliminar(id=${libro.id})}"
               th:data-confirmar="|¿Eliminar «${libro.titulo}»?|">
              <button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar">
                <i class="ti ti-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(libros)}">
          <td colspan="5" class="text-center text-body-secondary py-4">
            No hay libros que coincidan con la búsqueda.
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
