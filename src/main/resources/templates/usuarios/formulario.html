<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>

<main class="container py-4">
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
  <h1 class="h3 mb-3" th:text="${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario'">Nuevo usuario</h1>

  <form class="card card-body" method="post" novalidate th:object="${usuario}"
     th:action="${usuario.id == null} ? @{/usuarios} : @{/usuarios/{id}(id=${usuario.id})}">
    <div class="row g-3">
      <div class="col-md-4">
        <label for="nombre" class="form-label">Nombre *</label>
        <input type="text" class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
      </div>
      <div class="col-md-8">
        <label for="apellidos" class="form-label">Apellidos *</label>
        <input type="text" class="form-control" th:field="*{apellidos}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{apellidos}">Error</div>
      </div>
      <div class="col-md-4">
        <label for="dni" class="form-label">DNI/NIE *</label>
        <input type="text" class="form-control" th:field="*{dni}" th:errorclass="is-invalid"
           placeholder="12345678Z" maxlength="9">
        <div class="invalid-feedback" th:errors="*{dni}">Error</div>
      </div>
      <div class="col-md-8">
        <label for="email" class="form-label">Email *</label>
        <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid"
           placeholder="nombre@example.com">
        <div class="invalid-feedback" th:errors="*{email}">Error</div>
      </div>
      <div class="col-md-4">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" th:field="*{telefono}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{telefono}">Error</div>
      </div>
      <div class="col-md-4">
        <label for="fechaAlta" class="form-label">Fecha de alta *</label>
        <input type="date" class="form-control" th:field="*{fechaAlta}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{fechaAlta}">Error</div>
      </div>
      <div class="col-md-4">
        <label for="rol" class="form-label">Rol *</label>
        <select class="form-select" th:field="*{rol}" th:errorclass="is-invalid">
          <option th:each="opcion : ${roles}" th:value="${opcion}" th:text="${opcion.etiqueta}">Usuario</option>
        </select>
        <div class="invalid-feedback" th:errors="*{rol}">Error</div>
      </div>
      <div class="col-md-8">
        <label for="password" class="form-label" th:text="${usuario.id == null} ? 'Contraseña *' : 'Nueva contraseña'">Contraseña *</label>
        <input type="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid"
           autocomplete="new-password" minlength="8" maxlength="72">
        <div class="form-text" th:if="${usuario.id != null}">Déjala en blanco para conservar la actual.</div>
        <div class="invalid-feedback" th:errors="*{password}">Error</div>
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary">
        <i class="ti ti-check"></i> Guardar
      </button>
      <a class="btn btn-outline-secondary"
       th:href="${usuario.id == null} ? @{/usuarios} : @{/usuarios/{id}(id=${usuario.id})}">Cancelar</a>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
