spring.application.name=biblioteca

# --- Base de datos: MariaDB ---------------------------------------------------
# Por defecto apunta al MariaDB de docker compose publicado en el puerto 3307
# del equipo (para ejecutar la app desde el IDE con "docker compose up -d db").
# Dentro de Docker se sobrescriben con las variables SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:mariadb://localhost:3307/biblioteca
spring.datasource.username=biblioteca
spring.datasource.password=biblioteca

# --- JPA / Hibernate ----------------------------------------------------------
# Las tablas las crean los scripts de src/main/resources/db a partir del E/R.
# Hibernate solo valida que las entidades coinciden con ellas: si falta una
# columna o una tabla, la aplicación no arranca y lo indica en el log.
spring.jpa.hibernate.ddl-auto=validate
# Permite recorrer relaciones LAZY desde las vistas Thymeleaf (p. ej. libro.autores).
spring.jpa.open-in-view=true

# --- Sesión -------------------------------------------------------------------
# La sesión va solo en una cookie. Sin esto, Tomcat añade ";jsessionid=..." a la URL
# de la primera redirección (por ejemplo, después de crear un libro).
server.servlet.session.tracking-modes=cookie

# --- Actuator: healthcheck del contenedor --------------------------------------
management.endpoints.web.exposure.include=health

# --- Compresión -----------------------------------------------------------------
# Los scripts de la portada (Three.js, GSAP) y del panel (ECharts) viajan comprimidos.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml

# --- Caché de los recursos estáticos -------------------------------------------
# Thymeleaf añade a /css, /js e /img una huella de su contenido (estilos-3f9a....css): cuando un fichero
# cambia, cambia su dirección, así que el navegador puede guardarlos sin miedo a servir una versión vieja.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/img/**
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true
