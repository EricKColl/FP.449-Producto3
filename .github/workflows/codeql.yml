name: CodeQL

# Análisis de seguridad del código (inyecciones, XSS, rutas abiertas...) con CodeQL de GitHub.
# Los resultados salen en la pestaña «Security» del repositorio.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analizar:
    name: Analizar ${{ matrix.lenguaje }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - lenguaje: java-kotlin
            modo: manual
          - lenguaje: javascript-typescript
            modo: none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: matrix.lenguaje == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: ${{ matrix.modo }}
          queries: security-and-quality
      - name: Compilar
        if: matrix.lenguaje == 'java-kotlin'
        run: ./mvnw -B -DskipTests package
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.lenguaje }}
